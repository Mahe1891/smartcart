<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}SmartCart{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 🔥 BACKGROUND */
        body {
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c, #ff7a00);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
        }

        /* 🔥 NAVBAR */
        .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 0;
        }

        .navbar-brand {
            color: #ff7a00 !important;
            font-weight: bold;
            font-size: 20px;
        }

        .navbar-nav .nav-link {
            color: #ddd !important;
            padding: 8px 14px;
            font-weight: 500;
        }

        .navbar-nav .nav-link:hover {
            color: #ff7a00 !important;
        }

        /* 🔥 MAIN */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔥 FOOTER */
        .footer {
            background: #000;
            color: #aaa;
            text-align: center;
            padding: 12px;
            font-size: 14px;
        }
    </style>

    {% block extra_css %}{% endblock %}

</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="/admin-login">
                <span style="
                    width:38px;
                    height:38px;
                    background: linear-gradient(135deg,#ff7a00,#ff3c00);
                    border-radius:50%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    margin-right:8px;
                    font-size:18px;
                    box-shadow:0 0 10px rgba(255,122,0,0.6);
                ">
                    🛒
                </span>
                SmartCart
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="nav">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a class="nav-link" href="/admin-login">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin-contact">Contact</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- ================= PAGE CONTENT ================= -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        ⚡ SmartCart • Fast • Secure • Reliable <br>
        © 2026 All Rights Reserved
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>

</html>
