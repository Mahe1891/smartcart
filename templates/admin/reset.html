<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reset Password - SmartCart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c, #ff7a00);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;
}

.navbar {
    background: rgba(0,0,0,0.9);
}

.navbar-brand {
    color: #ff7a00 !important;
    font-weight: bold;
}

.main-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-box {
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    padding: 25px;
}

.form-control {
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: none;
}

.btn-custom {
    background: linear-gradient(135deg, #ff7a00, #ff3c00);
    color: white;
    border-radius: 12px;
    font-weight: bold;
}

.footer {
    background: #000;
    color: #aaa;
    text-align: center;
    padding: 12px;
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin-login">🛒 SmartCart</a>
  </div>
</nav>

<div class="main-content">

<div class="card-box">

    <!-- FLASH -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div id="flash-message" class="alert alert-success text-center mb-3">
        {{ message }}
    </div>
    {% endfor %}
    {% endwith %}

    <h3 class="text-center text-white mb-4">Reset Password</h3>

    <form method="POST" action="/reset-password">

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="New Password" required>
        </div>

        <div class="mb-3">
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
        </div>

        <button class="btn btn-custom w-100">Update Password</button>

    </form>

</div>

</div>

<footer class="footer">
⚡ SmartCart • Fast • Secure • Reliable <br>
© 2026 All Rights Reserved
</footer>

<script>
setTimeout(function() {
    let msg = document.getElementById("flash-message");
    if (msg) msg.style.display = "none";
}, 2000);
</script>

</body>
</html>
