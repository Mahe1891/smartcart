<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - SmartCart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body{
    display:flex;
    flex-direction:column;
    background: linear-gradient(135deg,#0f0f0f,#1c1c1c,#ff7a00);
    color:white;
    font-family:'Segoe UI', sans-serif;
}

/* NAVBAR */
.navbar{
    background:#000;
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar-brand{
    color:#ff7a00 !important;
    font-weight:bold;
}

.nav-link{
    color:#ccc !important;
}

.nav-link:hover,
.nav-link.active{
    color:#ff7a00 !important;
}

.nav-link.text-danger{
    color:#ff4d4d !important;
}

/* MAIN */
.main-content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* CARD */
.card-custom{
    width:100%;
    max-width:800px;
    padding:30px;
    border-radius:15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* IMAGE */
.product-img{
    border-radius:15px;
    width:100%;
    height:300px;
    object-fit:cover;
}

/* BUTTON */
.btn-custom{
    background: linear-gradient(135deg,#ff7a00,#ff3c00);
    color:white;
    border-radius:10px;
    font-weight:bold;
}

.btn-custom:hover{
    background: linear-gradient(135deg,#ff3c00,#ff7a00);
}

/* FOOTER */
.footer{
    background:#000;
    text-align:center;
    padding:12px;
    color:#aaa;
}

@media(max-width:576px){
    .card-custom{
        padding:20px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" href="/admin-dashboard">
            <span style="
                width:35px;
                height:35px;
                background: linear-gradient(#ff7a00,#ff3c00);
                border-radius:50%;
                display:flex;
                align-items:center;
                justify-content:center;
                margin-right:8px;
            ">🛒</span>
            SmartCart
        </a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/admin-dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/item-list">Products</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/admin-logout">Logout</a></li>
            </ul>
        </div>

    </div>
</nav>

<!-- MAIN -->
<div class="main-content">

    <div class="card-custom">

        <h2 class="text-center mb-4">Product Details</h2>

        <div class="row align-items-center">

            <!-- IMAGE -->
            <div class="col-md-6 mb-3">
                <img src="/static/uploads/product_images/{{ product.image }}" class="product-img">
            </div>

            <!-- DETAILS -->
            <div class="col-md-6">

                <h3>{{ product.name }}</h3>
                <p class="text-secondary">{{ product.category }}</p>

                <h4 class="mb-3" style="color:#00ff99;">₹{{ product.price }}</h4>

                <p>{{ product.description }}</p>

                <a href="/admin/item-list" class="btn btn-custom mt-3 w-100">
                    ← Back to List
                </a>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->
<footer class="footer">
    ⚡ SmartCart • Fast • Secure • Reliable <br>
    © 2026 All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
