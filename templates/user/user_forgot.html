{% extends "user/base.html" %}

{% block title %}Forgot Password - SmartCart{% endblock %}

{% block extra_css %}
<style>

/* CENTER WRAPPER (same across all pages) */
.page-wrapper {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 35px;
    border-radius: 18px;
    width: 360px;
    backdrop-filter: blur(18px);
    box-shadow: 
        0 10px 40px rgba(0,0,0,0.7),
        inset 0 0 15px rgba(255,255,255,0.05);
    text-align: center;
    animation: floatCard 4s ease-in-out infinite;

    will-change: transform;
}

/* FLOAT */
@keyframes floatCard {
    0% {transform: translateY(0px);}
    50% {transform: translateY(-6px);}
    100% {transform: translateY(0px);}
}

/* ICON */
.icon-box {
    width: 50px;
    height: 50px;
    background: linear-gradient(#ff7a00,#ff3c00);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 20px;
    box-shadow: 0 0 15px rgba(255,122,0,0.6);
}

/* TEXT */
.small-text {
    font-size: 13px;
    color: #bbb;
}

/* INPUT */
input {
    background: rgba(255,255,255,0.08) !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    color: white !important;
    padding: 10px;
    transition: 0.3s;
}

input:focus {
    border: 1px solid #ff7a00 !important;
    box-shadow: 0 0 10px #ff7a00;
    transform: scale(1.02);
}

input::placeholder {
    color: #aaa;
}

/* BUTTON */
.btn-custom {
    background: linear-gradient(45deg,#ff7a00,#ff3c00);
    border: none;
    padding: 10px;
    font-weight: 500;
    transition: 0.3s;
}

.btn-custom:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #ff7a00;
}

</style>
{% endblock %}

{% block content %}

<div class="page-wrapper">

    <div class="card-box">

        <!-- ICON -->
        <div class="icon-box">📧</div>

        <h4 class="mb-2">Forgot Password?</h4>
        <p class="small-text mb-3">Enter your email to receive OTP</p>

        <form method="POST">
            <input type="email" name="email" class="form-control mb-3" placeholder="Enter Email" required>

            <button class="btn btn-custom w-100">Send OTP →</button>
        </form>

        <p class="mt-3 small">
            <a href="/user-login" class="text-warning">Back to Login</a>
        </p>

    </div>

</div>

{% endblock %}
