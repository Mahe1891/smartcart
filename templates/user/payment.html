<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - SmartCart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #fff7ed, #ffedd5, #fed7aa);
    color: #111827;
    font-family: 'Segoe UI', sans-serif;
    overflow-x: hidden;
}

a {
    text-decoration: none;
}

/* NAVBAR */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #000 !important;
    padding: 10px 20px;
}

.navbar-brand {
    color: #ff7a00 !important;
    font-weight: bold;
}

.nav-btn {
    color: #ccc;
    margin: 0 8px;
    font-weight: 500;
}

.nav-btn:hover {
    color: #ff7a00;
}

.navbar-toggler {
    border: none;
}

/* MAIN */
.main-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px 12px;
}

.payment-box {
    background: rgba(255,255,255,0.96);
    padding: 35px 28px;
    border-radius: 24px;
    text-align: center;
    width: 100%;
    max-width: 390px;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
}

.payment-box h3 {
    font-weight: 800;
    color: #0f172a;
}

.amount-text {
    color: #64748b;
    font-weight: 600;
}

.payment-box h2 {
    font-weight: 900;
    color: #ff7a00;
}

.pay-btn {
    background: linear-gradient(135deg, #ff7a00, #ff3c00);
    border: none;
    padding: 11px 26px;
    border-radius: 50px;
    color: white;
    font-weight: bold;
    width: 100%;
}

.address-box {
    background: #fff7ed;
    color: #111827;
    padding: 12px;
    border-radius: 14px;
    margin-bottom: 15px;
    text-align: left;
    font-size: 14px;
}

/* FOOTER */
.footer {
    background: #111827;
    color: #d1d5db;
    padding: 40px 8% 15px;
    margin-top: auto;
}

.footer h5 {
    color: white;
    font-weight: 700;
}

.footer a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    margin-bottom: 7px;
}

.footer a:hover {
    color: #ff7a00;
}

.footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.1);
    margin-top: 25px;
    padding-top: 15px;
    text-align: center;
    font-size: 14px;
}

/* RESPONSIVE */
@media(max-width:991px) {
    #nav {
        background: #000;
        padding: 15px;
        border-top: 1px solid #222;
    }

    #nav a {
        display: block;
        padding: 8px 0;
    }

    .nav-btn {
        margin: 0;
    }
}

@media(max-width:575px) {
    .navbar {
        padding: 10px 12px;
    }

    .navbar-brand {
        font-size: 1rem;
    }

    .main-content {
        padding: 35px 12px;
    }

    .payment-box {
        padding: 28px 18px;
        border-radius: 20px;
    }

    .payment-box h3 {
        font-size: 23px;
    }

    .payment-box h2 {
        font-size: 28px;
    }

    .footer {
        padding: 30px 20px 15px;
    }
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
  <div class="container-fluid">

    <a class="navbar-brand d-flex align-items-center" href="/user-dashboard">
      <span style="width:35px;height:35px;
      background:linear-gradient(#ff7a00,#ff3c00);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-right:8px;">🛒</span>
      SmartCart
    </a>

    <button class="navbar-toggler bg-warning" type="button"
      data-bs-toggle="collapse" data-bs-target="#nav">
      ☰
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <div class="ms-auto d-flex flex-lg-row flex-column align-items-lg-center gap-2 mt-3 mt-lg-0">
        <a href="/user-dashboard" class="nav-btn">🏠 Home</a>
        <a href="/user/products" class="nav-btn">🛍 Shop</a>
        <a href="/user/profile" class="nav-btn">👤 Profile</a>
        <a href="/user/cart" class="nav-btn">🛒 Cart</a>
        <a href="/user-logout" class="nav-btn">Logout</a>
      </div>
    </div>

  </div>
</nav>

<div class="main-content">
    <div class="payment-box">

        <h3>💳 Complete Payment</h3>

        <!-- ✅ ADDRESS DISPLAY
        <div class="address-box">
            <b>{{ address.full_name }}</b><br>
            {{ address.phone }}<br>
            {{ address.address }}, {{ address.city }}<br>
            {{ address.state }} - {{ address.pincode }}
        </div> -->

        <p class="mt-3 amount-text">Total Amount</p>
        <h2>₹{{ amount }}</h2>

        <button id="rzp-button" class="pay-btn mt-3">Pay Now</button>

    </div>
</div>

<footer class="footer">
<div class="row gy-4">

<div class="col-md-4">
<h5><i class="bi bi-cart3"></i> SmartCart</h5>
<p>Your one-stop shop for electronics, fashion and more 🚀</p>
</div>

<div class="col-md-3">
<h5>Quick Links</h5>
<a href="/user-dashboard">Home</a>
<a href="/user/products">Shop</a>
<a href="/user/profile">Profile</a>
<a href="/user/cart">Cart</a>
</div>

<div class="col-md-3">
<h5>Categories</h5>
<a href="/user/products">Electronics</a>
<a href="/user/products">Fashion</a>
<a href="/user/products">Home</a>
<a href="/user/products">Gadgets</a>
</div>

<div class="col-md-2">
<h5>Follow Us</h5>
<div class="d-flex gap-3 fs-5">
<i class="bi bi-facebook"></i>
<i class="bi bi-instagram"></i>
<i class="bi bi-twitter-x"></i>
<i class="bi bi-youtube"></i>
</div>
</div>

</div>

<div class="footer-bottom">
© 2026 SmartCart | Fast • Secure • Reliable
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
var options = {
    "key": "{{ key_id }}",
    "amount": "{{ order_amount }}",
    "currency": "INR",
    "name": "SmartCart",
    "description": "Order Payment",
    "order_id": "{{ order_id }}",

    "handler": function (response) {
        var form = document.createElement("form");
        form.method = "POST";
        form.action = "/verify-payment";

        var fields = {
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_order_id: response.razorpay_order_id,
            razorpay_signature: response.razorpay_signature
        };

        for (var name in fields) {
            var input = document.createElement("input");
            input.type = "hidden";
            input.name = name;
            input.value = fields[name];
            form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();
    }
};

var rzp = new Razorpay(options);

document.getElementById('rzp-button').onclick = function (e) {
    rzp.open();
    e.preventDefault();
}
</script>

</body>
</html>
