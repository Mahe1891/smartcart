<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}SmartCart{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* BACKGROUND */
body {
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c, #ff7a00);
    background-size: 200% 200%;
    animation: bgMove 8s ease infinite;

    color: white;
    font-family: 'Segoe UI', sans-serif;

    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

@keyframes bgMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.navbar {
    background: #000;
}

.navbar-brand {
    color: #ff7a00 !important;
    font-weight: bold;
}

.nav-link {
    color: #ccc !important;
}

.nav-link:hover {
    color: #ff7a00 !important;
}

.main-content {
    flex: 1;
    padding: 20px;
}

/* FOOTER */
.footer {
    background: #000;
    text-align: center;
    padding: 15px;
    color: #aaa;
}

</style>

{% block extra_css %}{% endblock %}

</head>

<body>

<!-- ✅ NAVBAR (EXACT) -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="/">
            <span style="width:35px;height:35px;
            background:linear-gradient(#ff7a00,#ff3c00);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-right:8px;">🛒</span>
            SmartCart
        </a>

        <button class="navbar-toggler bg-warning" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
            <ul class="navbar-nav align-items-center gap-3">

                <li class="nav-item">
                    <a class="nav-link" href="/user-about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/user-contact">Contact</a>
                </li>

                <li class="nav-item">
                    <a href="/user-login">
                        <span class="nav-link text-warning fw-bold">Login</span>
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<!-- ✅ PAGE CONTENT -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<!-- ✅ FOOTER (EXACT) -->
<footer class="footer">
    ⚡ SmartCart • Fast • Secure • Reliable <br>
    © 2026 All Rights Reserved __Mahe__
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
