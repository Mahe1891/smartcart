<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Address</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff7ed, #ffedd5, #fed7aa);
    font-family: 'Segoe UI', sans-serif;
}

/* NAVBAR (EXACT) */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #000 !important;
    padding: 10px 20px;
}

.navbar-brand {
    color: #ff7a00 !important;
    font-weight: bold;
}

.nav-btn {
    color: #ccc;
    margin: 0 8px;
    font-weight: 500;
}

.nav-btn:hover {
    color: #ff7a00;
}

/* MAIN CENTER */
.main-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 12px;
}

/* CARD */
.box {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.96);
    padding: 32px 26px;
    border-radius: 24px;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.14);
}

/* INPUT */
.form-control {
    border-radius: 12px;
    padding: 10px;
}

/* BUTTON */
.btn-update {
    background: linear-gradient(45deg,#ff7a00,#ff3c00);
    color: white;
    border-radius: 50px;
    padding: 10px;
    border: none;
    font-weight: 600;
}

/* BACK */
.btn-back {
    text-decoration: none;
    color: #64748b;
    font-size: 14px;
}

.btn-back:hover {
    color: #000;
}

/* FOOTER (EXACT) */
.footer {
    background: #111827;
    color: #d1d5db;
    padding: 40px 8% 15px;
    margin-top: auto;
}

.footer h5 {
    color: white;
    font-weight: 700;
}

.footer a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    margin-bottom: 7px;
}

.footer a:hover {
    color: #ff7a00;
}

.footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.1);
    margin-top: 25px;
    padding-top: 15px;
    text-align: center;
    font-size: 14px;
}

/* RESPONSIVE */
@media(max-width:991px){
    #nav {
        background:#000;
        padding:15px;
        border-top:1px solid #222;
    }

    #nav a {
        display:block;
        padding:8px 0;
    }
}

@media(max-width:575px){
    .box {
        padding:22px 16px;
    }

    .btn-update {
        width:100%;
    }

    .footer {
        padding:30px 20px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
  <div class="container-fluid">

    <a class="navbar-brand d-flex align-items-center" href="/user-dashboard">
      <span style="width:35px;height:35px;
      background:linear-gradient(#ff7a00,#ff3c00);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-right:8px;">🛒</span>
      SmartCart
    </a>

    <button class="navbar-toggler bg-warning" type="button"
      data-bs-toggle="collapse" data-bs-target="#nav">
      ☰
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <div class="ms-auto d-flex flex-lg-row flex-column align-items-lg-center gap-2 mt-3 mt-lg-0">
        <a href="/user-dashboard" class="nav-btn">🏠 Home</a>
        <a href="/user/products" class="nav-btn">🛍 Shop</a>
        <a href="/user/my-orders" class="nav-btn">📦 My Orders</a>
        <a href="/user/profile" class="nav-btn">👤 Profile</a>
        <a href="/user/cart" class="nav-btn">🛒 Cart</a>
        <a href="/user-logout" class="nav-btn">Logout</a>
      </div>
    </div>

  </div>
</nav>

<!-- MAIN -->
<div class="main-content">

<div class="box">

<a href="/user/address" class="btn-back">⬅ Back</a>

<h3 class="mb-4 mt-2 fw-bold">✏ Edit Address</h3>

<form method="POST">

<input name="full_name" value="{{ address.full_name }}" class="form-control mb-3" placeholder="Full Name" required>

<input name="phone" value="{{ address.phone }}" class="form-control mb-3" placeholder="Phone Number" required>

<input name="pincode" value="{{ address.pincode }}" class="form-control mb-3" placeholder="Pincode" required>

<textarea name="address" class="form-control mb-3" placeholder="Full Address" required>{{ address.address }}</textarea>

<input name="city" value="{{ address.city }}" class="form-control mb-3" placeholder="City" required>

<input name="state" value="{{ address.state }}" class="form-control mb-4" placeholder="State" required>

<button class="btn-update w-100">Update Address</button>

</form>

</div>

</div>

<!-- FOOTER -->
<footer class="footer">
<div class="row gy-4">

<div class="col-md-4">
<h5><i class="bi bi-cart3"></i> SmartCart</h5>
<p>Your one-stop shop for electronics, fashion and more 🚀</p>
</div>

<div class="col-md-3">
<h5>Quick Links</h5>
<a href="/user-dashboard">Home</a>
<a href="/user/products">Shop</a>
<a href="/user/profile">Profile</a>
<a href="/user/cart">Cart</a>
</div>

<div class="col-md-3">
<h5>Categories</h5>
<a href="/user/products">Electronics</a>
<a href="/user/products">Fashion</a>
<a href="/user/products">Home</a>
<a href="/user/products">Gadgets</a>
</div>

<div class="col-md-2">
<h5>Follow Us</h5>
<div class="d-flex gap-3 fs-5">
<i class="bi bi-facebook"></i>
<i class="bi bi-instagram"></i>
<i class="bi bi-twitter-x"></i>
<i class="bi bi-youtube"></i>
</div>
</div>

</div>

<div class="footer-bottom">
© 2026 SmartCart | Fast • Secure • Reliable
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
