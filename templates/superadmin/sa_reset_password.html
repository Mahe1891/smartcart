{% extends "superadmin/base_superadmin.html" %}

{% block title %}Reset Password{% endblock %}

{% block css %}
<style>
    /* ❌ Removed body & navbar styles */

    .center-box {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }
</style>
{% endblock %}

{% block content %}

<div class="container center-box">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card p-4">

            <h3 class="text-center mb-3">Reset Password</h3>

            <!-- ❌ Flash removed (base handles it) -->

            <form method="POST">
                <input type="password" name="password" class="form-control mb-3" placeholder="New Password" required>
                <button class="btn btn-success w-100">Update Password</button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
